# PARAKRAM — warehouse grid definition (simulation world).
#
# SINGLE SOURCE OF TRUTH for:
#   * parakram_sim/worlds/warehouse.sdf        (generated: `ros2 run parakram_sim generate_warehouse`)
#   * parakram_bringup/maps/warehouse.{yaml,pgm} (generated by the same command)
#   * grid <-> world transforms                (parakram_sim.grid_utils)
#   * robot start cells / smoke-test goals per scenario
# parakram_bringup/config/warehouse_grid.yaml is a symlink to this file (CLAUDE_CODE/00 location).
#
# Conventions (CLAUDE_CODE/00):
#   cell (r, c): r = row index, increases with +y ; c = column index, increases with +x.
#   The lower-left corner of cell (0, 0) is at world (origin[0], origin[1]).
#   The map frame coincides with the Gazebo world frame (map origin chosen to match).
#   Flattened cell index (Intent.reserved_cells) = r * cols + c.
#
# Layout (r = 10 at the top, '#' = shelf block, '.' = free cell; 1-cell aisles everywhere):
#   r10  . . . . . . . . . . . . .
#   r 9  . # # . # # . # # . # # .
#   r 8  . # # . # # . # # . # # .
#   r 7  . # # . # # . # # . # # .
#   r 6  . # # . # # . # # . # # .
#   r 5  . . . . . . X . . . . . .     X = central junction (5, 6) at world (0, 0)
#   r 4  . # # . # # . # # . # # .
#   r 3  . # # . # # . # # . # # .
#   r 2  . # # . # # . # # . # # .
#   r 1  . # # . # # . # # . # # .
#   r 0  . . . . . . . . . . . . .
#        c0          c6          c12
# Every free cell lies on a cycle and the free-cell graph stays connected after removing any
# single cell (biconnected) -> satisfies PIBT's reachability condition (MASTER_BUILD_PLAN §4)
# and a silently-dead robot can never partition the floor.

grid:
  frame_id: map
  origin: [-2.6, -2.2]    # world (x0, y0) of the lower-left corner of cell (0, 0) [m]
  resolution: 0.40        # cell size [m]; >= 1.5 x robot width + localization margin (checked)
  rows: 11
  cols: 13

# TurtleBot3 Burger geometry (turtlebot3_description) used for sizing checks.
robot:
  width: 0.178                 # [m] across the wheels
  circumscribed_radius: 0.138  # [m] from base_footprint origin to the farthest footprint corner
  localization_margin: 0.10    # [m] RESEARCH/03 §6 (sim AMCL error is smaller; HW is 0.10-0.15)

# Physical geometry of the static obstacles (Gazebo world + occupancy map).
geometry:
  shelf_inset: 0.05       # [m] each shelf box is inset from its cell rectangle on every side
  shelf_height: 0.50      # [m] (taller than the lidar plane at ~0.18 m)
  wall_gap: 0.05          # [m] floor between the outer grid boundary and the wall inner face
  wall_thickness: 0.10    # [m]
  wall_height: 0.50       # [m]
  map_resolution: 0.05    # [m/pixel] occupancy map
  map_margin: 0.25        # [m] map extent beyond the wall outer faces

# Shelf blocks as inclusive cell rectangles [r_min, c_min, r_max, c_max].
shelf_blocks:
  - [1, 1, 4, 2]
  - [1, 4, 4, 5]
  - [1, 7, 4, 8]
  - [1, 10, 4, 11]
  - [6, 1, 9, 2]
  - [6, 4, 9, 5]
  - [6, 7, 9, 8]
  - [6, 10, 9, 11]

# Static occupancy list [r, c] (blocked cells = shelves). Must equal the union of shelf_blocks
# (enforced by generate_warehouse and by test/test_grid_utils.py).
blocked_cells:
  - [1, 1]
  - [1, 2]
  - [1, 4]
  - [1, 5]
